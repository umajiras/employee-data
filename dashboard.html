<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Sarabun',sans-serif;
  background:#EEF2F7;
  color:#333;
}

.container{
  width:100%;
  max-width:1400px;
  margin:auto;
  padding:18px;
}

.topbar{
  background:white;
  border-radius:16px;
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
  margin-bottom:14px;
}

.top-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-box{
  width:38px;
  height:38px;
  border-radius:10px;
  background:#E8F1FF;
  color:#185FA5;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo-title{
  font-size:22px;
  font-weight:700;
  color:#185FA5;
}

.btn{
  border:none;
  border-radius:12px;
  padding:10px 14px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-weight:600;
  transition:.2s;
}

.btn-gray{
  background:#F5F7FA;
  border:1px solid #DCE3EC;
}

.btn-gray:hover{
  background:#E8EDF4;
}

.btn-blue{
  background:#185FA5;
  color:white;
}

.btn-blue:hover{
  background:#0E4A84;
}

.btn-green{
  background:#4E8F1F;
  color:white;
}

.btn-green:hover{
  background:#3E7317;
}

.btn-amber{
  background:#A86A09;
  color:white;
  width:40px;
  height:40px;
  padding:0;
}

.btn-red{
  background:#B92E2E;
  color:white;
  width:40px;
  height:40px;
  padding:0;
}

.toolbar{
  background:white;
  border-radius:16px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:10px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
  margin-bottom:14px;
}

.search-wrap{
  flex:1;
  position:relative;
}

.search-wrap input{
  width:100%;
  padding:13px 14px 13px 44px;
  border:1px solid #D7E0EA;
  border-radius:12px;
  font-size:14px;
}

.search-icon{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:#666;
}

.table-wrap{
  overflow:auto;
  cursor:grab;
  background:white;
  border-radius:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1400px;
}

thead{
  background:#185FA5;
}

th{
  color:white;
  padding:14px;
  text-align:left;
  white-space:nowrap;
  font-size:14px;
}

td{
  padding:12px 14px;
  border-bottom:1px solid #EEF2F7;
  white-space:nowrap;
  font-size:14px;
}

tr:hover td{
  background:#F7FAFD;
}

.action-btns{
  display:flex;
  gap:8px;
}

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:1000;
}

.modal-bg.show{
  display:flex;
}

.modal{
  background:white;
  width:100%;
  max-width:680px;
  border-radius:18px;
  padding:24px;
}

.modal-title{
  font-size:22px;
  font-weight:700;
  margin-bottom:18px;
  color:#185FA5;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.full{
  grid-column:1/-1;
}

.modal input{
  width:100%;
  padding:12px;
  border:1px solid #D7E0EA;
  border-radius:12px;
}

.modal-footer{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

.loading{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.7);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:3000;
}

.loading.show{
  display:flex;
}

.spinner{
  width:44px;
  height:44px;
  border:4px solid #ddd;
  border-top-color:#185FA5;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.material-symbols-outlined{
  font-size:20px;
}

</style>
</head>

<body>

<div class="container">

  <div class="topbar">

    <div class="top-left">

      <div class="logo-box">
        <span class="material-symbols-outlined">
          inventory_2
        </span>
      </div>

      <div class="logo-title">
        ระบบข้อมูลพนักงาน
      </div>

    </div>

    <button
      class="btn btn-gray"
      onclick="logout()"
    >
      <span class="material-symbols-outlined">
        logout
      </span>
      ออกจากระบบ
    </button>

  </div>

  <div class="toolbar">

    <div class="search-wrap">

      <span class="material-symbols-outlined search-icon">
        search
      </span>

      <input
        type="text"
        id="searchInput"
        placeholder="ค้นหา รหัส / ชื่อ / ชื่อเล่น / เบอร์..."
        oninput="filterTable()"
      >

    </div>

    <button
      class="btn btn-blue"
      onclick="loadAll()"
    >
      <span class="material-symbols-outlined">
        table_rows
      </span>
      ดูทั้งหมด
    </button>

    <button
      class="btn btn-green"
      onclick="openAdd()"
    >
      <span class="material-symbols-outlined">
        person_add
      </span>
      เพิ่มพนักงาน
    </button>

  </div>

  <div class="table-wrap">

    <table>

      <thead>
        <tr>
          <th>จัดการ</th>
          <th>รหัส</th>
          <th>ชื่อ-นามสกุล</th>
          <th>ชื่อเล่น</th>
          <th>เบอร์โทร</th>
          <th>ผู้ติดต่อฉุกเฉิน 1</th>
          <th>ความสัมพันธ์</th>
          <th>เบอร์ฉุกเฉิน 1</th>
          <th>ผู้ติดต่อฉุกเฉิน 2</th>
          <th>ความสัมพันธ์</th>
          <th>เบอร์ฉุกเฉิน 2</th>
        </tr>
      </thead>

      <tbody id="tbody"></tbody>

    </table>

  </div>

</div>

<div class="modal-bg" id="modal">

  <div class="modal">

    <div class="modal-title" id="modalTitle">
      เพิ่มพนักงาน
    </div>

    <div class="form-grid">

      <div>
        <input id="fId" placeholder="รหัสพนักงาน">
      </div>

      <div>
        <input id="fNickname" placeholder="ชื่อเล่น">
      </div>

      <div class="full">
        <input id="fName" placeholder="ชื่อเต็ม">
      </div>

      <div class="full">
        <input id="fPhone" placeholder="เบอร์โทร">
      </div>

      <div class="full">
        <input id="fEc1Name" placeholder="ผู้ติดต่อฉุกเฉิน 1">
      </div>

      <div>
        <input id="fEc1Rel" placeholder="ความสัมพันธ์">
      </div>

      <div>
        <input id="fEc1Phone" placeholder="เบอร์">
      </div>

      <div class="full">
        <input id="fEc2Name" placeholder="ผู้ติดต่อฉุกเฉิน 2">
      </div>

      <div>
        <input id="fEc2Rel" placeholder="ความสัมพันธ์">
      </div>

      <div>
        <input id="fEc2Phone" placeholder="เบอร์">
      </div>

    </div>

    <div class="modal-footer">

      <button
        class="btn btn-gray"
        onclick="closeModal()"
      >
        ยกเลิก
      </button>

      <button
        class="btn btn-blue"
        onclick="saveEmployee()"
      >
        บันทึก
      </button>

    </div>

  </div>

</div>

<div class="loading" id="loading">
  <div class="spinner"></div>
</div>

<script>

const session =
  JSON.parse(localStorage.getItem("session"));

if(!session || session.role !== "admin"){

  location.href="/admin.html";
}

let allEmployees=[];
let isAdding=true;
let currentRow=null;

function showLoading(v){

  document
    .getElementById("loading")
    .classList[v?"add":"remove"]("show");
}

async function api(url,method="GET",body=null){

  const res = await fetch(url,{
    method,
    headers:{
      "Content-Type":"application/json",
      "Authorization":
        "Bearer " + localStorage.getItem("token")
    },
    body:body?JSON.stringify(body):null
  });

  return res.json();
}

async function loadAll(){

  showLoading(true);

  try{

    const result =
      await api("/api/getAll");

    allEmployees =
      result.data || [];

    renderTable(allEmployees);

  }catch(e){

    alert("โหลดข้อมูลไม่ได้");
  }

  showLoading(false);
}

function renderTable(data){

  const tbody =
    document.getElementById("tbody");

  if(!data.length){

    tbody.innerHTML = `
      <tr>
        <td colspan="11" style="text-align:center;padding:40px">
          ไม่พบข้อมูล
        </td>
      </tr>
    `;

    return;
  }

  tbody.innerHTML = data.map(d=>`

    <tr>

      <td>

        <div class="action-btns">

          <button
            class="btn btn-amber"
            onclick="openEdit('${d.id}')"
          >
            <span class="material-symbols-outlined">
              edit
            </span>
          </button>

          <button
            class="btn btn-red"
            onclick="delEmployee('${d.id}',${d.row})"
          >
            <span class="material-symbols-outlined">
              delete
            </span>
          </button>

        </div>

      </td>

      <td>${d.id||""}</td>
      <td>${d.name||""}</td>
      <td>${d.nickname||""}</td>
      <td>${d.phone||""}</td>
      <td>${d.ec1_name||""}</td>
      <td>${d.ec1_relation||""}</td>
      <td>${d.ec1_phone||""}</td>
      <td>${d.ec2_name||""}</td>
      <td>${d.ec2_relation||""}</td>
      <td>${d.ec2_phone||""}</td>

    </tr>

  `).join("");
}

function filterTable(){

  const q =
    document
    .getElementById("searchInput")
    .value
    .toLowerCase();

  const filtered =
    allEmployees.filter(e=>

      (e.id||"").toLowerCase().includes(q) ||
      (e.name||"").toLowerCase().includes(q) ||
      (e.nickname||"").toLowerCase().includes(q) ||
      (e.phone||"").toLowerCase().includes(q)
    );

  renderTable(filtered);
}

function openAdd(){

  isAdding = true;

  currentRow = null;

  modalTitle.innerText =
    "เพิ่มพนักงาน";

  [
    "fId",
    "fName",
    "fNickname",
    "fPhone",
    "fEc1Name",
    "fEc1Rel",
    "fEc1Phone",
    "fEc2Name",
    "fEc2Rel",
    "fEc2Phone"
  ].forEach(id=>{

    document.getElementById(id).value="";
  });

  modal.classList.add("show");
}

function openEdit(id){

  const e =
    allEmployees.find(x=>x.id==id);

  if(!e)return;

  isAdding = false;

  currentRow = e.row;

  modalTitle.innerText =
    "แก้ไขข้อมูล";

  fId.value=e.id||"";
  fName.value=e.name||"";
  fNickname.value=e.nickname||"";
  fPhone.value=e.phone||"";
  fEc1Name.value=e.ec1_name||"";
  fEc1Rel.value=e.ec1_relation||"";
  fEc1Phone.value=e.ec1_phone||"";
  fEc2Name.value=e.ec2_name||"";
  fEc2Rel.value=e.ec2_relation||"";
  fEc2Phone.value=e.ec2_phone||"";

  modal.classList.add("show");
}

function closeModal(){

  modal.classList.remove("show");
}

async function saveEmployee(){

  const data = {

    id:fId.value.trim(),
    name:fName.value.trim(),
    nickname:fNickname.value.trim(),
    phone:fPhone.value.trim(),

    ec1_name:fEc1Name.value.trim(),
    ec1_relation:fEc1Rel.value.trim(),
    ec1_phone:fEc1Phone.value.trim(),

    ec2_name:fEc2Name.value.trim(),
    ec2_relation:fEc2Rel.value.trim(),
    ec2_phone:fEc2Phone.value.trim(),

    row:currentRow
  };

  showLoading(true);

  try{

    const res =
      await api(

        isAdding
        ? "/api/add"
        : "/api/update",

        "POST",

        data
      );

    alert(res.success || res.error);

    if(res.success){

      closeModal();

      loadAll();
    }

  }catch(e){

    alert("เกิดข้อผิดพลาด");
  }

  showLoading(false);
}

async function delEmployee(id,row){

  if(!confirm("ลบพนักงาน "+id+" ?"))
    return;

  showLoading(true);

  try{

    const res =
      await api(
        "/api/delete",
        "POST",
        {id,row}
      );

    alert(res.success || res.error);

    if(res.success){

      loadAll();
    }

  }catch(e){

    alert("เกิดข้อผิดพลาด");
  }

  showLoading(false);
}

function logout(){

  localStorage.removeItem("session");

  localStorage.removeItem("token");

  location.href="/admin.html";
}

function initDragScroll(){

  const slider =
    document.querySelector(".table-wrap");

  if(!slider)return;

  let isDown = false;
  let startX;
  let scrollLeft;

  slider.addEventListener("mousedown",(e)=>{

    isDown = true;

    startX =
      e.pageX - slider.offsetLeft;

    scrollLeft =
      slider.scrollLeft;
  });

  slider.addEventListener("mouseleave",()=>{

    isDown = false;
  });

  slider.addEventListener("mouseup",()=>{

    isDown = false;
  });

  slider.addEventListener("mousemove",(e)=>{

    if(!isDown)return;

    e.preventDefault();

    const x =
      e.pageX - slider.offsetLeft;

    const walk =
      (x - startX) * 1.5;

    slider.scrollLeft =
      scrollLeft - walk;
  });
}

initDragScroll();

loadAll();

</script>

</body>
</html>
